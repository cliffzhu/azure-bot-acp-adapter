name: Auto-merge requester PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable-auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      AUTO_MERGE_REQUESTERS: ${{ vars.AUTO_MERGE_REQUESTERS }}
      AUTO_MERGE_METHOD: ${{ vars.AUTO_MERGE_METHOD }}
    steps:
      - name: Merge PR for allowed requester
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            core.info('AUTO_MERGE_REQUESTERS=' + (process.env.AUTO_MERGE_REQUESTERS ?? '<unset>'));
            core.info('AUTO_MERGE_METHOD=' + (process.env.AUTO_MERGE_METHOD ?? '<unset>'));

            const allowedRequesters = (process.env.AUTO_MERGE_REQUESTERS ?? '')
              .split(',')
              .map((v) => v.trim().toLowerCase())
              .filter(Boolean);

            if (allowedRequesters.length === 0) {
              core.setFailed('Repository variable AUTO_MERGE_REQUESTERS is not set. Add a comma-separated list of GitHub logins to allow auto-merge.');
              return;
            }

            if (!context.payload || !context.payload.pull_request) {
              core.setFailed('This workflow run has no pull_request payload. Trigger must be a pull_request event.');
              return;
            }

            const author = (context.payload.pull_request.user && context.payload.pull_request.user.login ? context.payload.pull_request.user.login : '').toLowerCase();
            if (!allowedRequesters.includes(author)) {
              core.notice('Skipping PR #' + context.payload.pull_request.number + ': ' + author + ' is not in AUTO_MERGE_REQUESTERS.');
              return;
            }

            const configuredMethod = (process.env.AUTO_MERGE_METHOD ?? 'squash').trim().toUpperCase();
            const validMethods = new Set(['MERGE', 'SQUASH', 'REBASE']);
            if (!validMethods.has(configuredMethod)) {
              core.setFailed('AUTO_MERGE_METHOD must be one of merge, squash, or rebase. Received: ' + (process.env.AUTO_MERGE_METHOD ?? '<unset>'));
              return;
            }

            const pullRequestNumber = context.payload.pull_request.number;
            const mergeMethodLower = configuredMethod.toLowerCase();

            // NOTE: This job is intentionally the only status check configured to run
            // on pull requests in this repository (no CI runs on `pull_request`, and no
            // reviews are required). That means calling the GraphQL
            // `enablePullRequestAutoMerge` mutation - which waits for status checks to
            // finish in the *future* - can never succeed: while this very job is
            // running, GitHub reports the PR's mergeable_state as UNSTABLE (a pending,
            // non-required check on itself), and that check cannot be marked
            // "completed" until after this job's own run finishes. No amount of
            // retrying inside this same job can ever observe it clear.
            //
            // Since there is nothing else to actually wait for, merge the PR directly
            // instead. A direct merge only requires `mergeable: true` (no conflicts),
            // which is unaffected by the transient/self-referential "unstable" state.
            const maxRetries = 5;
            const retryDelayMs = 3000;

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              let pr;
              try {
                ({ data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequestNumber
                }));
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.setFailed('Unable to fetch PR #' + pullRequestNumber + ' before merging. GitHub response: ' + message);
                break;
              }

              if (pr.merged) {
                core.notice('PR #' + pullRequestNumber + ' is already merged.');
                break;
              }

              if (pr.mergeable === null) {
                // GitHub is still computing mergeability (mergeable_state: unknown).
                if (attempt < maxRetries) {
                  core.notice('Mergeability for PR #' + pullRequestNumber + ' is still being computed. Retrying attempt ' + attempt + '/' + maxRetries + '...');
                  await new Promise(function(resolve) { setTimeout(resolve, retryDelayMs); });
                  continue;
                }

                core.setFailed('Timed out waiting for GitHub to compute mergeability for PR #' + pullRequestNumber + '.');
                break;
              }

              if (pr.mergeable === false) {
                core.setFailed('PR #' + pullRequestNumber + ' has merge conflicts and cannot be auto-merged.');
                break;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequestNumber,
                  merge_method: mergeMethodLower
                });

                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'docker-publish.yml',
                  ref: 'main'
                });

                core.notice('Merged PR #' + pullRequestNumber + ' from ' + author + ' using ' + mergeMethodLower + '.');
                break;
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);

                if (message.toLowerCase().indexOf('already been merged') !== -1) {
                  core.notice('PR #' + pullRequestNumber + ' was already merged.');
                  break;
                }

                if (message.toLowerCase().indexOf('unstable status') !== -1 && attempt < maxRetries) {
                  core.notice('Merge reported unstable status for PR #' + pullRequestNumber + '. Retrying attempt ' + attempt + '/' + maxRetries + '...');
                  await new Promise(function(resolve) { setTimeout(resolve, retryDelayMs); });
                  continue;
                }

                core.setFailed([
                  'Unable to merge PR #' + pullRequestNumber + '.',
                  'Confirm that the GITHUB_TOKEN can write pull requests and that no required checks/reviews are blocking it.',
                  'GitHub response: ' + message
                ].join(' '));
                break;
              }
            }
